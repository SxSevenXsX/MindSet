name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.3.1
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Use an existing version tag such as v1.3.1.'
          }

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify source version and syntax
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag and package version differ.' }
          foreach ($source in @('src/app.js', 'src/editor-blocks.js', 'src/editor-document.js', 'scripts/release.mjs')) {
            node --check $source
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $source" }
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Keep downloadable build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MindSet-Windows-${{ inputs.tag }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Upload and publish verified assets
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $names = @("MindSet-Setup-$version.exe", "MindSet-Setup-$version.exe.blockmap", 'latest.yml')
          foreach ($name in $names) {
            if (!(Test-Path -LiteralPath "dist/$name")) { throw "Missing artifact: $name" }
          }
          $manifest = Get-Content dist/latest.yml -Raw
          $hash = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes("dist/$($names[0])")))
          if (!$manifest.Contains("version: $version") -or !$manifest.Contains($hash)) {
            throw 'The update manifest does not match the installer.'
          }
          $existingJson = gh release view $env:RELEASE_TAG --json isDraft
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title $version --notes-file CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          } elseif (!(($existingJson | ConvertFrom-Json).isDraft)) {
            throw 'This version is already published. Use a new version tag.'
          }
          $releaseList = gh api "repos/$env:GH_REPO/releases" | ConvertFrom-Json
          $releaseData = $releaseList | Where-Object { $_.tag_name -ceq $env:RELEASE_TAG }
          if ($LASTEXITCODE -ne 0 -or !$releaseData -or !$releaseData.draft) { throw 'Could not read draft release.' }
          $uploadBase = $releaseData.upload_url.Split('{')[0]
          foreach ($name in $names) {
            $existing = @($releaseData.assets | Where-Object { $_.name -ceq $name })
            foreach ($asset in $existing) {
              gh api --method DELETE "repos/$env:GH_REPO/releases/assets/$($asset.id)"
              if ($LASTEXITCODE -ne 0) { throw "Could not replace draft asset: $name" }
            }
            $uploadUrl = "$($uploadBase)?name=$([Uri]::EscapeDataString($name))"
            $curlConfig = 'url = "' + $uploadUrl + '"' + "`n" + 'header = "Authorization: Bearer ' + $env:GH_TOKEN + '"' + "`n"
            $responsePath = Join-Path $env:RUNNER_TEMP 'mindset-upload-response.json'
            Write-Host "Uploading $name"
            $curlConfig | curl.exe --config - --silent --show-error --fail-with-body --ipv4 --http1.1 --connect-timeout 20 --max-time 180 --request POST --data-binary "@dist/$name" --header 'Content-Type: application/octet-stream' --header 'Accept: application/vnd.github+json' --output $responsePath
            if ($LASTEXITCODE -ne 0) {
              Get-Content -LiteralPath $responsePath -ErrorAction SilentlyContinue
              throw "Asset upload failed: $name; release remains unpublished."
            }
            $uploaded = Get-Content -LiteralPath $responsePath -Raw | ConvertFrom-Json
            if ($uploaded.size -ne (Get-Item -LiteralPath "dist/$name").Length -or $uploaded.state -ne 'uploaded') {
              throw "Asset upload incomplete: $name"
            }
          }
          $releaseJson = gh release view $env:RELEASE_TAG --json assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded assets.' }
          $assets = ($releaseJson | ConvertFrom-Json).assets
          foreach ($name in $names) {
            $asset = @($assets | Where-Object { $_.name -ceq $name })
            if ($asset.Count -ne 1 -or $asset[0].size -ne (Get-Item -LiteralPath "dist/$name").Length) {
              throw "Uploaded asset verification failed: $name"
            }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
