name: Publish Windows release
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.3.2
        type: string
permissions:
  contents: read
concurrency:
  group: mindset-windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Use an existing version tag such as v1.3.2.'
          }
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify source version and syntax
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag and package version differ.' }
          foreach ($source in @('src/app.js', 'src/editor-blocks.js', 'src/editor-document.js', 'scripts/release.mjs')) {
            node --check $source
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $source" }
          }
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist -- --publish never
      - name: Keep downloadable build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MindSet-Windows-${{ inputs.tag }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  publish:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Download Windows installer
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: MindSet-Windows-${{ inputs.tag }}
          path: dist
      - name: Verify and publish installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo 'Tag and package version differ.' >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const version = require('./package.json').version;
          const manifest = fs.readFileSync('dist/latest.yml', 'utf8');
          const file = `dist/MindSet-Setup-${version}.exe`;
          const hash = crypto.createHash('sha512').update(fs.readFileSync(file)).digest('base64');
          if (!manifest.split(/\r?\n/).includes(`version: ${version}`) || !manifest.includes(hash)) {
            throw Error('Update manifest does not match installer.');
          }
          NODE
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/mindset-release.json"; then
            node -e 'if (!require(process.argv[1]).isDraft) throw Error("This version is already published.")' "$RUNNER_TEMP/mindset-release.json"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$version" --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_TAG" "dist/MindSet-Setup-$version.exe" "dist/MindSet-Setup-$version.exe.blockmap" dist/latest.yml --clobber
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/mindset-assets.json"
          node <<'NODE'
          const fs = require('node:fs');
          const version = require('./package.json').version;
          const { assets } = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/mindset-assets.json`, 'utf8'));
          for (const name of [`MindSet-Setup-${version}.exe`, `MindSet-Setup-${version}.exe.blockmap`, 'latest.yml']) {
            const matches = assets.filter(asset => asset.name === name);
            if (matches.length !== 1 || matches[0].size !== fs.statSync(`dist/${name}`).size) {
              throw Error(`Uploaded asset verification failed: ${name}`);
            }
          }
          NODE
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file CHANGELOG.md
