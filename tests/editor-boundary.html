<!doctype html><html lang="fr"><meta charset="utf-8"><title>Contrôles des limites de l’éditeur</title><h1 id="summary">Tests en cours</h1><ul id="results"></ul><div id="editor" contenteditable="true"></div><script src="../src/editor-boundary.js"></script><script>
const editor=document.getElementById('editor'),tests=[];
const check=(name,run)=>tests.push({name,run});
function select(node,offset,end=offset){editor.focus();const r=document.createRange();r.setStart(node,offset);r.setEnd(node,end);getSelection().removeAllRanges();getSelection().addRange(r);}
function assert(value){if(!value)throw Error('Assertion échouée');}
check('Retour arrière au début du texte, du bloc ou du document',()=>{editor.innerHTML='<p><strong>Texte</strong></p>';for(const node of [editor,editor.firstChild,editor.querySelector('strong'),editor.querySelector('strong').firstChild]){select(node,0);assert(MindSetEditorBoundary.atStart(editor));}});
check('Une ligne vide initiale reste intacte, même avec le curseur sur BR',()=>{editor.innerHTML='<p><br></p>';select(editor.querySelector('br'),0);assert(MindSetEditorBoundary.atStart(editor));});
check('Le début d’un second paragraphe vide reste supprimable',()=>{editor.innerHTML='<p><br></p><p><br></p>';select(editor.lastChild,0);assert(!MindSetEditorBoundary.atStart(editor));select(editor,1);assert(!MindSetEditorBoundary.atStart(editor));});
check('Une sélection et un caractère précédent restent supprimables',()=>{editor.innerHTML='<p>abc</p>';select(editor.firstChild.firstChild,0,2);assert(!MindSetEditorBoundary.atStart(editor));select(editor.firstChild.firstChild,1);assert(!MindSetEditorBoundary.atStart(editor));});
check('Une image précédente reste supprimable',()=>{editor.innerHTML='<p><img alt="Image"></p><p>Texte</p>';select(editor.lastChild.firstChild,0);assert(!MindSetEditorBoundary.atStart(editor));});
check('Les saisies tactiles et suppressions de mots respectent la limite',()=>{editor.innerHTML='<p>abc</p>';select(editor.firstChild.firstChild,0);for(const inputType of ['deleteContentBackward','deleteWordBackward','deleteSoftLineBackward','deleteHardLineBackward']){const event=new InputEvent('beforeinput',{inputType,cancelable:true});assert(MindSetEditorBoundary.blockBoundaryDelete(event,editor)&&event.defaultPrevented);}});
check('La composition et la suppression vers l’avant restent natives',()=>{editor.innerHTML='<p>abc</p>';select(editor.firstChild.firstChild,0);for(const event of [new KeyboardEvent('keydown',{key:'Backspace',isComposing:true,cancelable:true}),new KeyboardEvent('keydown',{key:'Delete',cancelable:true}),new InputEvent('beforeinput',{inputType:'deleteContentForward',cancelable:true})]){assert(!MindSetEditorBoundary.blockBoundaryDelete(event,editor)&&!event.defaultPrevented);}});
let passed=0;for(const {name,run} of tests){const el=document.createElement('li');try{run();passed++;el.className='pass';el.textContent='✓ '+name;}catch(error){el.className='fail';el.textContent='✗ '+name+' : '+error.message;}document.querySelector('#results').append(el);}document.querySelector('#summary').textContent=`${passed} / ${tests.length} vérifications réussies`;
</script></html>
